<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="display: flex;">
    <div>
      <canvas id="grafico_linha" style="position: relative; height:40vh; width:40vw"> </canvas>
    </div>
    <div>
      <canvas id="grafico_barra" style="position: relative; height:40vh; width:40vw"> </canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      const grafico_linha = document.getElementById("grafico_linha");

      new Chart(grafico_linha, {
        type: "line",
        data: {
          labels: ["12:00", "13:00", "14:00", "15:00", "16:00", "17:00"],
          datasets: [
            {
              label: "Temperatura",
              data: [30, 29, 28, 25, 22, 23],
              borderWidth: 1,
              backgroundColor: 'rgb(254, 99, 130)',
              borderColor: 'rgb(254, 99, 130)', 
            },
            {
              label: "Umidade",
              data: [80, 82, 80, 85, 80, 83],
              borderWidth: 1,
              backgroundColor: 'rgb(54, 162, 235)',
              borderColor: 'rgb(54, 162, 235)',
            },
          ],
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      });
      const grafico_barra = document.getElementById("grafico_barra");

      new Chart(grafico_barra, {
        type: "bar",
        data: {
          labels: ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho"],
          datasets: [
            {
              label: "Temperatura Média",
              data: [22, 24, 27, 23, 20, 18],
              borderWidth: 1,
              backgroundColor: 'rgb(254, 99, 130)',
              borderColor: 'rgb(254, 99, 130)', 
            },
            {
              label: "Umidade Média",
              data: [90, 89, 93, 87, 88, 82],
              borderWidth: 1,
              backgroundColor: 'rgb(54, 162, 235)',
              borderColor: 'rgb(54, 162, 235)',
            },
          ],
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      });
    </script>
  </body>
</html>
